name: Backend security

on:
  pull_request:
    paths:
      - "backend/**"
      - "supabase/**"
      - "render.yaml"
      - ".github/workflows/backend-security.yml"
  push:
    branches: [backend]
    paths:
      - "backend/**"
      - "supabase/**"
      - "render.yaml"
      - ".github/workflows/backend-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install application and security scanners
        run: python -m pip install -r backend/requirements.txt pytest pip-audit bandit
      - name: Audit Python dependencies
        run: python -m pip_audit -r backend/requirements.txt
      - name: Scan backend source
        run: bandit -q -r backend/app
      - name: Run backend tests
        run: python -m pytest backend/tests

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        with:
          args: git --redact .
