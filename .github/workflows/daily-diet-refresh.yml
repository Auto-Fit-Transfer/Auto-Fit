name: Daily diet refresh

on:
  schedule:
    # GitHub Actions schedules use UTC; 15:00 UTC is 00:00 Asia/Seoul.
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      all_ai:
        description: "DB 음식 카탈로그 조회 없이 4식을 모두 AI로 생성"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-diet-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Refresh daily recommendations
        env:
          DIET_REFRESH_CRON_TOKEN: ${{ secrets.DIET_REFRESH_CRON_TOKEN }}
          DIET_REFRESH_MODE: ${{ inputs.all_ai && 'all-ai' || 'normal' }}
        run: |
          curl --fail-with-body --show-error --silent \
            --retry 3 --retry-all-errors --max-time 1200 \
            --request POST \
            --header "X-Cron-Token: ${DIET_REFRESH_CRON_TOKEN}" \
            --header "X-Diet-Refresh-Mode: ${DIET_REFRESH_MODE}" \
            https://auto-fit-api-dev.onrender.com/internal/diet-refresh
