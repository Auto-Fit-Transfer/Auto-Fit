name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt pytest
      - run: python -m pytest -q backend/tests
        env:
          PYTHONPATH: .

  ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai_service/requirements.txt
      - run: python -m pip install -r requirements.txt pytest pytest-asyncio
        working-directory: ai_service
      - run: python -m pytest -q -m "not live"
        working-directory: ai_service

  ocr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ocr_service/requirements-server.txt
      - run: python -m pip install -r requirements-server.txt pytest httpx
        working-directory: ocr_service
      - run: python -m pytest -q tests
        working-directory: ocr_service

  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file deploy/stack/.env.example -f deploy/stack/compose.yaml config --no-env-resolution -q

  db-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0
      - run: supabase start --exclude studio
      - name: Verify complete migration replay
        run: |
          expected=$(find supabase/migrations -maxdepth 1 -name '*.sql' | wc -l | tr -d '[:space:]')
          actual=$(docker exec supabase_db_Auto-Fit psql -U postgres -d postgres -Atc "
            select (select count(*) from supabase_migrations.schema_migrations)::text || '|' ||
              (to_regclass('public.exercise_session_analyses') is not null)::text || '|' ||
              exists(select 1 from pg_trigger where tgname = 'require_ai_exercise_recommendation_insert' and not tgisinternal)::text || '|' ||
              (to_regprocedure('public.start_exercise_session(uuid,uuid)') is not null)::text || '|' ||
              (to_regprocedure('public.start_exercise_plan_session(uuid,uuid,uuid)') is not null)::text || '|' ||
              exists(select 1 from pg_constraint where conname = 'exercise_recommendations_ai_or_archived_check')::text;
          ")
          test "$actual" = "${expected}|true|true|false|true|true"
      - name: Verify archived exercise sessions are read-only
        run: docker exec -i supabase_db_Auto-Fit psql -U postgres -d postgres -v ON_ERROR_STOP=1 < backend/tests/archived_exercise_session_sql.sql
      - name: Verify non-AI exercise archive upgrade
        run: |
          set -o pipefail
          cat backend/tests/archive_non_ai_upgrade_pre.sql \
            supabase/migrations/20261105020000_archive_non_ai_exercise_recommendations.sql \
            backend/tests/archive_non_ai_upgrade_post.sql \
            | docker exec -i supabase_db_Auto-Fit psql -U postgres -d postgres -v ON_ERROR_STOP=1
      - if: always()
        run: supabase stop || true

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit bandit
      - run: python -m pip_audit -r backend/requirements.txt
      # Chroma HTTP-server advisories are inapplicable to the embedded PersistentClient.
      # See docs/security-exceptions.md; remove these IDs when a fixed release is available.
      - run: >-
          python -m pip_audit -r ai_service/requirements.txt
          --ignore-vuln PYSEC-2026-311
          --ignore-vuln PYSEC-2026-3813
          --ignore-vuln PYSEC-2026-3814
          --ignore-vuln PYSEC-2026-3815
      - run: python -m pip_audit -r ocr_service/requirements-server.txt
      - run: bandit -q -lll -r backend/app ai_service/app ocr_service/server ocr_service/ocr
      - uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        with:
          args: git --redact .
