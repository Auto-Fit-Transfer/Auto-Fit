name: auto-fit-backend

services:
  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    env_file: ./api.env
    environment:
      BACKEND_ALLOWED_HOSTS: "${API_DOMAIN:?Set API_DOMAIN},localhost,127.0.0.1"
      AI_SERVER_ENABLED: "true"
      AI_SERVER_BASE_URL: "https://${AI_DOMAIN:?Set AI_DOMAIN}"
      HEALTH_DOCUMENT_OCR_URL: "https://${OCR_DOMAIN:?Set OCR_DOMAIN}/ai/ocr"
      HEALTH_DOCUMENT_OCR_MOCK_ENABLED: "false"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 6s
      start_period: 30s
      retries: 3
    depends_on:
      - ai
      - ocr

  ai:
    build:
      context: ../../ai_service
    env_file: ./ai.env
    volumes:
      - ai_chroma:/app/data/chroma
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)"]
      interval: 30s
      timeout: 6s
      start_period: 60s
      retries: 3

  ocr:
    build:
      context: ../../ocr_service
    env_file: ./ocr.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5))['status']=='ok'"]
      interval: 30s
      timeout: 6s
      start_period: 30s
      retries: 3

  caddy:
    image: caddy:2.10.2
    environment:
      API_DOMAIN: "${API_DOMAIN:?Set API_DOMAIN}"
      AI_DOMAIN: "${AI_DOMAIN:?Set AI_DOMAIN}"
      OCR_DOMAIN: "${OCR_DOMAIN:?Set OCR_DOMAIN}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      ai:
        condition: service_healthy
      ocr:
        condition: service_healthy
    networks:
      default:
        aliases:
          - "${API_DOMAIN:?Set API_DOMAIN}"
          - "${AI_DOMAIN:?Set AI_DOMAIN}"
          - "${OCR_DOMAIN:?Set OCR_DOMAIN}"
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  ai_chroma:
